name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNOME extension tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell libglib2.0-bin zip

      - name: Derive CalVer metadata version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(date -u +'%s')"
          tag="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          echo "Release tag: $tag"

      - name: Update metadata version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = int(os.environ["VERSION_NUMBER"])
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}

      - name: Validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool metadata.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("metadata.json"))["uuid"])')" = "dash-in-panel@syrenny"

      - name: Pack extension
        shell: bash
        run: |
          set -euo pipefail
          glib-compile-schemas schemas
          gnome-extensions pack --force
          test -f dash-in-panel@syrenny.shell-extension.zip

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh install.sh
          chmod +x install.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            dash-in-panel@syrenny.shell-extension.zip
            install.sh
          generate_release_notes: true
